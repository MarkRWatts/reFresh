services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refresh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-refresh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-refresh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-refresh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-refresh}?schema=public
      RECIPE_IMAGES_DIR: /app/storage/recipe-images
      # Multi-household auth (Better Auth) — see .env.docker.example and
      # DEPLOYMENT.md's Google/Resend setup steps.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.docker}
      AUTH_URL: ${AUTH_URL:?set AUTH_URL in .env.docker}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?set AUTH_TRUSTED_ORIGINS in .env.docker}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?set AUTH_GOOGLE_ID in .env.docker}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?set AUTH_GOOGLE_SECRET in .env.docker}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env.docker}
      # Optional — empty/unset means the app-level sign-in gate is off
      # (see src/auth.ts's isAllowedEmail and DEPLOYMENT.md's Going public 3b).
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    volumes:
      # Scraper's HTML cache — keeps re-scrapes/reprocesses from re-downloading
      # every recipe page. Also where the PDF-import OCR engine's language
      # model gets cached after its first download (see src/lib/pdfImport/ocr.ts)
      # — safe to delete if you want a clean slate, it'll just refetch.
      - scraper-cache:/app/.cache
      # Output of `npm run db:snapshot`.
      - db-backups:/app/db-backups
      # Cover/step photos cropped out of imported PDF cards (see
      # src/lib/pdfImport/imageStorage.ts) — not under public/, since that's
      # baked into the image at build time and wouldn't survive a redeploy.
      - recipe-images:/app/storage/recipe-images

volumes:
  pgdata:
  scraper-cache:
  db-backups:
  recipe-images:
